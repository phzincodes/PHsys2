name: Erro reproduzível
description: Relate comportamento e evidências sem informações pessoais.
body:
  - type: markdown
    attributes:
      value: Não publique logs brutos, snapshots privados, seriais, senhas ou tokens. Vulnerabilidades exigem canal privado; consulte SECURITY.md.
  - type: textarea
    id: steps
    attributes: {label: Passos para reproduzir, description: Use dados de teste e remova identificadores.}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Resultado esperado e observado}
    validations: {required: true}
  - type: input
    id: version
    attributes: {label: Versão do app e do Windows}
