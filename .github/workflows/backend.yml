name: Backend and PostgreSQL
on: [push, pull_request]
permissions: {contents: read}
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: phsystem_test_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d phsystem_test_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PHSYSTEM_TEST_POSTGRES: Host=localhost;Database=phsystem_test_ci;Username=postgres
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '10.0.x'}
      - run: dotnet build src/PHsystem.Server -c Release
      - run: dotnet test tests/PHsystem.UnitTests -c Release --logger trx
      - run: dotnet test tests/PHsystem.IntegrationTests -c Release --logger trx
      - run: dotnet test tests/PHsystem.SecurityTests -c Release --filter 'Platform!=Windows' --logger trx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: tests/**/TestResults/*.trx
