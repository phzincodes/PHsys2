name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore PHsystem.slnx
      - run: dotnet build PHsystem.slnx --no-restore
      - run: dotnet test PHsystem.slnx --no-build --logger trx
        env:
          PHSYSTEM_UI_CAPTURE_DIRECTORY: ${{ github.workspace }}/artifacts/ui-validation
      - run: dotnet list PHsystem.slnx package --vulnerable --include-transitive
      - run: dotnet publish src/PHsystem.Desktop -c Release -r win-x64 --self-contained true -o artifacts/desktop

      - name: Build preview installer when Inno Setup is available
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (Test-Path -LiteralPath $compiler) {
            ./tools/BuildInstaller.ps1 -Compiler $compiler
          } else {
            Write-Output '::warning::Inno Setup unavailable; installer was not built. No installation is attempted.'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-preview-installer
          if-no-files-found: warn
          path: artifacts/releases/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-evidence
          path: |
            tests/**/TestResults/*.trx
            artifacts/ui-validation/*.png
